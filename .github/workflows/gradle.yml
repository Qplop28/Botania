name: Botania 26.1.2 Fabric Port

on:
  push:
    branches:
      - 26.1.2-fabric-port
  pull_request:
    branches:
      - 26.1.2-fabric-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric-compile:
    name: Compile Fabric
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Resolve Fabric dependencies
        id: resolve
        continue-on-error: true
        run: |
          ./gradlew :Fabric:dependencies \
            --configuration compileClasspath \
            --stacktrace \
            --no-daemon > gradle-resolve.log 2>&1

      - name: Compile Fabric
        id: compile
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew :Fabric:compileJava \
            --stacktrace \
            --no-daemon > gradle-compile.log 2>&1

      - name: Upload Gradle diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-port-gradle-logs
          path: |
            gradle-resolve.log
            gradle-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail workflow when Gradle fails
        if: steps.resolve.outcome == 'failure' || steps.compile.outcome == 'failure'
        run: |
          echo "Gradle failed. See the fabric-port-gradle-logs artifact."
          exit 1