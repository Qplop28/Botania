name: Botania 26.1.2 Fabric Port

on:
  push:
    branches:
      - 26.1.2-fabric-port
  pull_request:
    branches:
      - 26.1.2-fabric-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric-compile:
    name: Compile Fabric
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Resolve Fabric dependencies
        run: ./gradlew :Fabric:dependencies --configuration compileClasspath --stacktrace

      - name: Compile Fabric
        run: ./gradlew :Fabric:compileJava --stacktrace